[package]
name = "tradeflow-binance-market-data"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Standalone Rust client for Binance Spot and USD-M Futures public market data"

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "query", "rustls"] }
serde_json = "1"
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
