[package]
name = "tradeflow-lite"
version = "0.1.0"
description = "TradeFlow Lite desktop market chart"
edition = "2024"

[lib]
name = "tradeflow_lite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["provider-binance", "provider-polymarket"]
provider-binance = ["dep:tradeflow-binance-market-data"]
provider-polymarket = ["dep:reqwest"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
flate2 = "1.1.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = [] }
tradeflow-binance-market-data = { path = "crates/binance-market-data", optional = true }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "query", "rustls"], optional = true }
