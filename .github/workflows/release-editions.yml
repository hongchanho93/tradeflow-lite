name: Build TradeFlow Lite editions

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.edition }} / ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: cn
            platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS-Apple-Silicon
            features: '--features provider-tdx'
            config: src-tauri/tauri.release.conf.json
          - edition: cn
            platform: macos-15-intel
            target: x86_64-apple-darwin
            label: macOS-Intel
            features: '--features provider-tdx'
            config: src-tauri/tauri.release.conf.json
          - edition: cn
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows-x64
            features: '--features provider-tdx'
            config: src-tauri/tauri.windows.release.conf.json
          - edition: global
            platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS-Apple-Silicon
            features: ''
            config: src-tauri/tauri.release.conf.json
          - edition: global
            platform: macos-15-intel
            target: x86_64-apple-darwin
            label: macOS-Intel
            features: ''
            config: src-tauri/tauri.release.conf.json
          - edition: global
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows-x64
            features: ''
            config: src-tauri/tauri.windows.release.conf.json
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: npm ci
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e "const fs = require('fs'); const version = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json')).version; if (process.env.RELEASE_TAG !== 'v' + version) { throw new Error('Tag must match app version v' + version); }"
      - run: npm run test:market-edition
      - run: npm run test:ui
      - uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRADEFLOW_LITE_EDITION: ${{ matrix.edition }}
          VITE_TRADEFLOW_LITE_EDITION: ${{ matrix.edition }}
          APPLE_SIGNING_IDENTITY: '-'
        with:
          args: ${{ matrix.features }} --target ${{ matrix.target }} --config ${{ matrix.config }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('TradeFlow Lite {0}', github.ref_name) || '' }}
          releaseBody: 'Unsigned build for review. Verify both editions on their target systems and complete signing before publication.'
          releaseDraft: true
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: TradeFlow-Lite-${{ matrix.edition }}-${{ matrix.label }}-[bundle]
          releaseAssetNamePattern: TradeFlow-Lite-${{ matrix.edition }}_[version]_[platform]_[arch][setup].[ext]
